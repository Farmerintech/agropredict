# Periodically re-download the WFP / HDX Nigeria food-price dataset and commit
# any changes back to the repo.
#
# You can also trigger it manually: repo → Actions → "Refresh WFP price data"
# → "Run workflow".
name: Refresh WFP price data

on:
  schedule:
    # Every Monday 03:17 UTC — WFP prices update roughly monthly.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and normalize prices
        run: python scripts/fetch_wfp_hdx.py

      # The agrocast app fetches its price history from this repo when online.
      # Build a compact monthly snapshot (normalized per kg/litre, not the raw
      # 4.7 MB CSV) so the app can mirror the latest data without the download.
      - name: Build agrocast snapshot JSON
        run: node scripts/build_market_snapshot.js --emit json --csv data/wfp_nigeria_normalized.csv --out data/agrocast-market.json

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wfp_nigeria_normalized.csv data/agrocast-market.json
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "chore(data): refresh WFP price observations"
            git push
          fi
